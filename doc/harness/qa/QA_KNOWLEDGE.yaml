- discovered: 2026-09-21
  topic: worktree-ownership-cli-qa-platform-gates
  note: >-
    On the Linux QA host, Git 2.43.0 lacks `git worktree repair --relative-paths`,
    so the supported-relative-backpointer test skips; Windows case and junction
    tests also skip. A direct built CLI recovery fixture can still verify the
    confirmation prompt, in-place registration, file preservation, refusal,
    and stage-specific rollback error. Once registration succeeds, `ccc codex`
    may exit 1 at the later Docker check when Docker is unavailable; assert the
    `Recreated Git worktree registration` and `Using existing workspace` lines
    and inspect Git status to distinguish that from a recovery failure.

- discovered: 2026-09-21
  topic: worktree-recovery-registration-name
  note: >-
    Confirmed recovery registers a temporary sibling first, so Git may assign a
    management entry named for that temporary sibling. Read the recovered
    workspace's .git link to find the installed entry; do not assume the
    original missing management directory name reappears. Built CLI QA on Linux
    confirmed recovery exit 0 and file preservation, while the reported
    Git for Windows host still requires a retry.

- discovered: 2026-09-25
  topic: docker-in-ccc-drvfs-codex-e2e
  note: >-
    Inside a ccc container on a Windows/WSL2 host, use `sudo -n docker`. The
    container's /home/ccc/.codex is a drvfs 9p bind of host `C:\Users\<u>\.ccc\codex`;
    a scratch subdir created at /home/ccc/.codex/<name> is reachable by sibling
    containers via `--mount "type=bind,source=C:\Users\<u>\.ccc\codex\<name>,target=..."`
    (use --mount, not -v, because of the drive colon). A full `docker build` of the
    repo Dockerfile finishes in about 2 minutes when the layer cache is warm; build it from a
    minimal scratch context (Dockerfile, package*.json, scripts/{localhost-proxy,
    clipboard-shims,ccc-x11-bridge,ccc-entrypoint.sh}, x11-mcp, device-lab-mcp
    without node_modules) because the repo has no .dockerignore. codex is reachable
    in sibling containers by mounting ccc-mise-cache and prepending
    /home/ccc/.local/share/mise/shims to PATH; `timeout 90 script -qc "codex agents"
    /dev/null </dev/null` triggers the daemon install (exit 124 = TUI waited, install ok).
    Negative control without the packages volume prints "Permission denied (os error 13)".
